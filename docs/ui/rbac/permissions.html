      <div class="nav-group">知识库</div>

    <div class="sidebar-user">
      <div class="avatar" data-role="user-avatar">管</div>
      <div class="meta"><div class="name" data-role="user-name">超级管理员</div><div class="email" data-role="user-email">admin@example.com</div></div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="breadcrumb">系统管理<span class="sep">/</span><span class="cur">权限管理</span></div>
      <div class="spacer"></div>
      <div class="identity-switch">
        <span class="hint">演示身份</span>
        <div class="seg">
          <button data-identity="admin" class="active">超级管理员</button>
          <button data-identity="viewer">访客（只读）</button>
        </div>
      </div>
    </header>
    <div class="content">
      <div class="page">
        <div class="page-head">
          <div class="head-row">
            <div>
              <h1>权限管理</h1>
              <div class="subtitle">权限码目录，采用「模块:操作」命名规范</div>
            </div>
            <button class="btn btn-primary" data-perm="permission:create" onclick="RBACHtml.toast('新建权限（演示）','violet')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建权限
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>权限清单</h2>
            <div class="tools"><span class="badge violet"><span class="dot"></span>共 <b id="permTotal">0</b> 项权限</span></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>模块</th><th>权限码</th><th>权限名称</th><th style="width:160px">操作</th></tr></thead>
              <tbody id="permTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="rbac.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var tbody = document.getElementById('permTbody');
  var html = '';
  var total = 0;
  RBAC.groups.forEach(function (g) {
    g.perms.forEach(function (p) {
      total++;
      html += '<tr>' +
        '<td><span class="mod-badge ' + g.color + '"><span class="dot"></span>' + g.name + '</span></td>' +
        '<td class="code">' + p.code + '</td>' +
        '<td>' + p.name + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="btn btn-ghost btn-sm" data-perm="permission:update">编辑</button>' +
          '<button class="btn btn-danger btn-sm" data-perm="permission:delete">删除</button>' +
        '</div></td>' +
      '</tr>';
    });
  });
  tbody.innerHTML = html;
  document.getElementById('permTotal').textContent = total;
  RBAC.applyGating();
});
</script>
</body>
</html>
