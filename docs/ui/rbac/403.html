<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无权访问 · 辰光 Agent</title>
<link rel="stylesheet" href="rbac.css">
</head>
<body>
<div class="forbidden">
  <div class="box">
    <div class="glyph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div class="code-label">403 · FORBIDDEN</div>
    <h1>无权访问</h1>
    <p>当前账号缺少访问该页面的权限。<br>如需操作，请让管理员为你分配角色或权限，例如 <span class="perm-chip">user:list</span>。</p>
    <div class="actions">
      <a class="btn btn-primary" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回工作台</a>
      <a class="btn btn-outline" href="login.html">切换账号</a>
    </div>
  </div>
</div>
</body>
</html>
